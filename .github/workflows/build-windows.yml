name: Build Windows Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.1.0)"
        required: false
        default: "dev"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Portable App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Verify frontend build
        run: |
          if (-not (Test-Path "frontend/dist/index.html")) {
            Write-Error "Frontend build failed — index.html not found"
            exit 1
          }
          $count = (Get-ChildItem -Path "frontend/dist" -Recurse -File).Count
          Write-Host "Frontend built: $count files"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Download kiwipiepy model
        run: |
          python -c "
          import kiwipiepy, pathlib, glob, os
          m = kiwipiepy.Kiwi()
          print('Kiwi loaded:', m)
          # Find model files - check common locations
          candidates = [
              pathlib.Path(kiwipiepy.__path__[0]) / 'model',
              pathlib.Path.home() / '.kiwipiepy' / 'model',
              pathlib.Path.home() / '.kiwipiepy',
          ]
          # Also search for recently created model files
          for p in candidates:
              print(f'{p}: exists={p.exists()}, contents={list(p.iterdir()) if p.exists() else \"N/A\"}')
          # Search for kiwi model files in temp/appdata
          for root in [os.environ.get('TEMP', ''), os.environ.get('LOCALAPPDATA', '')]:
              if root:
                  found = glob.glob(os.path.join(root, '**', '*.tar.gz'), recursive=True)
                  if found:
                      print(f'Found tar in {root}: {found}')
          "

       - name: Build with PyInstaller
        run: |
          # Build --add-data args dynamically
          $addData = @()
          $addData += "--add-data"
          $addData += "backend/dictionary/bundled_dict.json;backend/dictionary"
          $addData += "--add-data"
          $addData += "frontend/dist;frontend_dist"

          # Find kiwipiepy model
          python -c "import kiwipiepy, pathlib; p=pathlib.Path(kiwipiepy.__path__[0])/'model'; open('kiwi_model_path.txt','w').write(p.as_posix())"
          $kiwiModel = Get-Content kiwi_model_path.txt
          Write-Host "Kiwi model path: $kiwiModel"
          Write-Host "Kiwi model exists: $(Test-Path $kiwiModel)"
          if (Test-Path $kiwiModel) {
            Get-ChildItem $kiwiModel | Format-Table Name, Length
            $addData += "--add-data"
            $addData += "$kiwiModel;kiwipiepy/model"
          } else {
            Write-Host "WARNING: kiwipiepy model not found — will download at first use"
          }

          # Build hidden imports
          $hiddenImports = @()
          "api", "api.extract_vocab", "api.models", "cache", "cache.store",
          "config_paths", "dictionary", "dictionary.bundled", "dictionary.nikl",
          "dictionary.provider", "nlp", "nlp.pipeline", "nlp.ranker",
          "nlp.lemmatizer", "nlp.filtering", "nlp.tokenizer", "nlp.sentencizer",
          "nlp.translator", "deep_translator", "deep_translator.google_translator" |
            ForEach-Object { $hiddenImports += "--hidden-import"; $hiddenImports += $_ }

          # Run PyInstaller
          pyinstaller --clean --onedir --name KoreanVocabExtractor `
            --distpath dist `
            $addData `
            $hiddenImports `
            --exclude pytest --exclude setuptools --exclude pip `
            --exclude tkinter --exclude unittest `
            backend/run_app.py

      - name: Create distribution ZIP
        run: |
          Write-Host "=== dist/ contents ==="
          Get-ChildItem -Path dist | Format-Table Mode, Length, Name
          $appDir = "dist\KoreanVocabExtractor"
          $zipFile = "dist\KoreanVocabExtractor.zip"
          if (Test-Path $appDir) {
            Compress-Archive -Path "$appDir\*" -DestinationPath $zipFile -Force
            $size = [math]::Round((Get-Item $zipFile).Length / 1MB, 2)
            Write-Host "ZIP: $zipFile ($size MB)"
          } else {
            Write-Error "App directory not found at $appDir"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoreanVocabExtractor-Windows
          path: dist/KoreanVocabExtractor.zip
          retention-days: 30
          if-no-files-found: error

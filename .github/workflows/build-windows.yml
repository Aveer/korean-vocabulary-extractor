name: Build Windows Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.1.0)"
        required: false
        default: "dev"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Portable App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Verify frontend build
        run: |
          if (-not (Test-Path "frontend/dist/index.html")) {
            Write-Error "Frontend build failed — index.html not found"
            exit 1
          }
          $count = (Get-ChildItem -Path "frontend/dist" -Recurse -File).Count
          Write-Host "Frontend built: $count files"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Download kiwipiepy model
        run: |
          python -c "import kiwipiepy; m = kiwipiepy.Kiwi(); print('Kiwi model loaded:', m)"

      - name: Build with PyInstaller
        run: |
          # Find kiwipiepy model path — use forward slashes via as_posix()
          python -c "import kiwipiepy, pathlib; p=pathlib.Path(kiwipiepy.__path__[0])/'model'; open('kiwi_model_path.txt','w').write(p.as_posix())"
          $kiwiModel = Get-Content kiwi_model_path.txt
          Write-Host "Kiwi model path: $kiwiModel"
          Write-Host "Kiwi model exists: $(Test-Path $kiwiModel)"
          if (Test-Path $kiwiModel) {
            Write-Host "Kiwi model contents:"
            Get-ChildItem $kiwiModel | Format-Table Name, Length
          }

          pyinstaller --clean --onedir `
            --name KoreanVocabExtractor `
            --add-data "backend/dictionary/bundled_dict.json;backend/dictionary" `
            --add-data "frontend/dist;frontend_dist" `
            --add-data "$kiwiModel;kiwipiepy/model" `
            --hidden-import api `
            --hidden-import api.extract_vocab `
            --hidden-import api.models `
            --hidden-import cache `
            --hidden-import cache.store `
            --hidden-import config_paths `
            --hidden-import dictionary `
            --hidden-import dictionary.bundled `
            --hidden-import dictionary.nikl `
            --hidden-import dictionary.provider `
            --hidden-import nlp `
            --hidden-import nlp.pipeline `
            --hidden-import nlp.ranker `
            --hidden-import nlp.lemmatizer `
            --hidden-import nlp.filtering `
            --hidden-import nlp.tokenizer `
            --hidden-import nlp.sentencizer `
            --hidden-import nlp.translator `
            --hidden-import deep_translator `
            --hidden-import deep_translator.google_translator `
            --exclude pytest `
            --exclude setuptools `
            --exclude pip `
            --exclude tkinter `
            --exclude unittest `
            --distpath dist `
            backend/run_app.py

      - name: Create distribution ZIP
        run: |
          Write-Host "=== dist/ contents ==="
          Get-ChildItem -Path dist | Format-Table Mode, Length, Name
          $appDir = "dist\KoreanVocabExtractor"
          $zipFile = "dist\KoreanVocabExtractor.zip"
          if (Test-Path $appDir) {
            Compress-Archive -Path "$appDir\*" -DestinationPath $zipFile -Force
            $size = [math]::Round((Get-Item $zipFile).Length / 1MB, 2)
            Write-Host "ZIP: $zipFile ($size MB)"
          } else {
            Write-Error "App directory not found at $appDir"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoreanVocabExtractor-Windows
          path: dist/KoreanVocabExtractor.zip
          retention-days: 30
          if-no-files-found: error

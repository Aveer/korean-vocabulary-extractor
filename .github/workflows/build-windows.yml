name: Build Windows Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.1.0)"
        required: false
        default: "dev"
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build-windows:
    name: Build Windows Portable App
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set artifact metadata
        shell: pwsh
        run: |
          $version = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "run-${{ github.run_number }}"
          }
          $safeVersion = $version -replace '[^A-Za-z0-9._-]', '-'
          "ARTIFACT_NAME=KoreanVocabExtractor-Windows-$safeVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Run backend tests
        run: python -m pytest tests/ -v

      - name: Validate packaging scripts
        shell: pwsh
        run: |
          python -m py_compile backend/config_paths.py scripts/build_package.py backend/run_app.py backend/api/study.py backend/study/db.py backend/study/service.py backend/api/models.py backend/api/extract_vocab.py backend/main.py
          python -c "from pathlib import Path; compile(Path('KoreanVocabExtractor.spec').read_text(encoding='utf-8'), 'KoreanVocabExtractor.spec', 'exec'); print('spec syntax ok')"

      - name: Build and smoke-test portable executable
        run: python scripts/build_package.py --clean --skip-python-install

      - name: Stage user-facing artifact
        shell: pwsh
        run: |
          $exe = "dist\KoreanVocabExtractor\KoreanVocabExtractor.exe"
          $zip = "dist\KoreanVocabExtractor.zip"
          if (-not (Test-Path $exe)) {
            Write-Error "Executable not found at $exe"
            exit 1
          }
          if (-not (Test-Path $zip)) {
            Write-Error "ZIP not found at $zip"
            exit 1
          }
          $zipSize = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          Write-Host "Verified $exe"
          Write-Host "Verified $zip ($zipSize MB)"

          $artifactDir = "dist\artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item -Recurse -Force "dist\KoreanVocabExtractor" "$artifactDir\KoreanVocabExtractor"
          Copy-Item -Force $zip "$artifactDir\KoreanVocabExtractor.zip"
          @"
          Korean Vocab Extractor Windows portable app

          To run after downloading from GitHub Actions:
          1. Extract the GitHub artifact ZIP.
          2. Open the KoreanVocabExtractor folder.
          3. Double-click KoreanVocabExtractor.exe.

          No Python or Node.js installation is required. The included
          KoreanVocabExtractor.zip contains the same portable app folder for
          release uploads or re-sharing.
          "@ | Set-Content -Encoding UTF8 "$artifactDir\README-WINDOWS.txt"

          if (-not (Test-Path "$artifactDir\KoreanVocabExtractor\KoreanVocabExtractor.exe")) {
            Write-Error "Runnable artifact folder was not staged correctly."
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/artifact/**
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

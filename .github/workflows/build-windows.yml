name: Build Windows Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.1.0)"
        required: false
        default: "dev"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Portable App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Verify frontend build
        run: |
          if (-not (Test-Path "frontend/dist/index.html")) {
            Write-Error "Frontend build failed — index.html not found"
            exit 1
          }
          $count = (Get-ChildItem -Path "frontend/dist" -Recurse -File).Count
          Write-Host "Frontend built: $count files"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Download kiwipiepy model
        run: |
          python -c "import kiwipiepy; m=kiwipiepy.Kiwi(); print('Kiwi loaded:', m)"

      - name: Build with PyInstaller
        run: |
          # Write build script to avoid PowerShell escaping issues
          python -c "
          import kiwipiepy, pathlib, textwrap
          script = textwrap.dedent('''
              import subprocess, sys, os
              import kiwipiepy
              from pathlib import Path

              hidden = [
                  'api', 'api.extract_vocab', 'api.models',
                  'cache', 'cache.store', 'config_paths',
                  'dictionary', 'dictionary.bundled', 'dictionary.nikl', 'dictionary.provider',
                  'nlp', 'nlp.pipeline', 'nlp.ranker', 'nlp.lemmatizer',
                  'nlp.filtering', 'nlp.tokenizer', 'nlp.sentencizer', 'nlp.translator',
                  'deep_translator', 'deep_translator.google_translator',
              ]
              excludes = ['pytest', 'setuptools', 'pip', 'tkinter', 'unittest']

              cmd = [sys.executable, '-m', 'PyInstaller', '--clean', '--onedir',
                     '--name', 'KoreanVocabExtractor', '--distpath', 'dist',
                     '--add-data', 'backend/dictionary/bundled_dict.json;backend/dictionary',
                     '--add-data', 'frontend/dist;frontend_dist']

              # kiwipiepy model
              kiwi_model = Path(kiwipiepy.__path__[0]) / 'model'
              if kiwi_model.exists():
                  print(f'Kiwi model found: {kiwi_model}')
                  cmd += ['--add-data', f'{kiwi_model};kiwipiepy/model']
              else:
                  print(f'Kiwi model not found, will download at first use')

              for h in hidden:
                  cmd += ['--hidden-import', h]
              for e in excludes:
                  cmd += ['--exclude', e]
              cmd.append('backend/run_app.py')

              print('Running:', ' '.join(cmd))
              result = subprocess.run(cmd)
              sys.exit(result.returncode)
          ''')
          with open('build_app.py', 'w') as f:
              f.write(script)
          "
          python build_app.py

      - name: Create distribution ZIP
        run: |
          Write-Host "=== dist/ contents ==="
          Get-ChildItem -Path dist | Format-Table Mode, Length, Name
          $appDir = "dist\KoreanVocabExtractor"
          $zipFile = "dist\KoreanVocabExtractor.zip"
          if (Test-Path $appDir) {
            Compress-Archive -Path "$appDir\*" -DestinationPath $zipFile -Force
            $size = [math]::Round((Get-Item $zipFile).Length / 1MB, 2)
            Write-Host "ZIP: $zipFile ($size MB)"
          } else {
            Write-Error "App directory not found at $appDir"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoreanVocabExtractor-Windows
          path: dist/KoreanVocabExtractor.zip
          retention-days: 30
          if-no-files-found: error
